name: Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check src server integrations benchmarks tests
      - run: PYTHONPATH=.:src python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integrations/openclaw_plugin/index.test.js
