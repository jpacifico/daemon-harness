name: productivity_benchmark_observer
version: 1.0.0
description: "Content-safe observer for disposable productivity benchmark runs."
hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
